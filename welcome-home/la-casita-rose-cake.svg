<title id="cakeTitle">Pink and white Dominican mini cake with three tasting fillings</title>
<desc id="cakeDesc">Illustrative traditional Dominican mini cake with pink buttercream-style roses, white frosting and pearls on a gold board, alongside guava, pineapple and dulce de leche fillings in three separate cups. Photo-inspired rendering, not a photograph of the final product.</desc>
