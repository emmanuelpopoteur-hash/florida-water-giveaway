# Copy to internal/crm-reconciler/wrangler.production.toml AFTER replacing the D1 ID.
# Deploy as an independent Worker, not in the Pages build.
# Keep secret CRM_INGEST_TOKEN encrypted in Cloudflare runtime, not in this file.
name = "legacy-water-crm-reconciler"
main = "internal/crm-reconciler/worker.js"
compatibility_date = "2026-10-30"
workers_dev = false
preview_urls = false
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "legacy-water-leads"
database_id = "REPLACE_WITH_PUBLIC_PRODUCTION_LEGACY_WATER_LEADS_DATABASE_ID"

[[services]]
binding = "CRM_SERVICE"
service = "legacy-water-crm-ingest"
