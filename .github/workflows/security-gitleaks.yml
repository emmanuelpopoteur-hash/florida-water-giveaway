name: Security - Gitleaks
on:
  pull_request:
  push:
    branches: [main, cloudflare-migration, feature/legacy-github-toolkit]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect accidental secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
