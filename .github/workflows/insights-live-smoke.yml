name: Insights public website availability check
on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - '.github/workflows/insights-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live-insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify the public homepage and bilingual articles
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://legacywaterusa.com/"
            "https://legacywaterusa.com/insights/"
            "https://legacywaterusa.com/insights/es/"
            "https://legacywaterusa.com/insights/st-cloud-water-quality-2025/"
            "https://legacywaterusa.com/insights/toho-water-rates-2026/"
            "https://legacywaterusa.com/insights/es/calidad-agua-st-cloud-2025/"
            "https://legacywaterusa.com/insights/es/tarifas-toho-2026/"
          )
          for url in "${urls[@]}"; do
            echo "Checking: ${url}"
            html=$(curl --fail --silent --show-error --location --max-time 25 --header 'Cache-Control: no-cache' "${url}") || { echo "::error::URL failed: ${url}"; exit 1; }
            if [[ "${url}" == "https://legacywaterusa.com/" ]]; then
              grep -Fq 'data-insights' <<< "${html}" || { echo "::error::Homepage is not serving the merged Insights navigation"; exit 1; }
            else
              grep -Fq 'utm_campaign=water_education__' <<< "${html}" || { echo "::error::Article or hub not available with tracking: ${url}"; exit 1; }
            fi
            echo "PASS: ${url}"
          done
          echo "Checking sitemap, robots and the lead-form landing page"
          sitemap=$(curl --fail --silent --show-error --location --max-time 25 https://legacywaterusa.com/sitemap.xml)
          grep -Fq '<urlset' <<< "${sitemap}"
          grep -Fq 'https://legacywaterusa.com/insights/es/tarifas-toho-2026/' <<< "${sitemap}"
          echo 'PASS: sitemap lists bilingual articles'
          robots=$(curl --fail --silent --show-error --location --max-time 25 https://legacywaterusa.com/robots.txt)
          grep -Fq 'Sitemap: https://legacywaterusa.com/sitemap.xml' <<< "${robots}"
          echo 'PASS: robots.txt advertises sitemap'
          lead=$(curl --fail --silent --show-error --location --max-time 25 'https://legacywaterusa.com/check/?lang=en&utm_source=legacy_insights&utm_campaign=water_education__stcloud_ccr_2025')
          grep -Fq 'id="leadForm"' <<< "${lead}"
          echo 'PASS: existing lead form loads with article attribution (no form submission)'
      - name: Confirm consent-aware GA4 is live without submitting leads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            home=$(curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' 'https://legacywaterusa.com/') || true
            if grep -Fq '/media/ga4-consent.js' <<< "${home:-}"; then
              echo "GA4 loader found on production homepage."
              break
            fi
            echo "Production GA4 deployment not visible yet; check ${attempt}/15"
            sleep 8
          done
          grep -Fq '<script src="/media/ga4-consent.js" defer></script>' <<< "${home:-}"
          for uri in /insights/ /insights/es/ /check/ /privacy/ /privacy/es/; do
            html=$(curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' "https://legacywaterusa.com${uri}")
            grep -Fq '<script src="/media/ga4-consent.js" defer></script>' <<< "${html}"
            echo "PASS analytics loader: ${uri}"
          done
          tag=$(curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' 'https://legacywaterusa.com/media/ga4-consent.js')
          grep -Fq "MEASUREMENT_ID = 'G-QGPB6TBYGF'" <<< "${tag}"
          grep -Fq "choice !== 'granted'" <<< "${tag}"
          grep -Fq "'generate_lead'" <<< "${tag}"
          app=$(curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' 'https://legacywaterusa.com/check/app.js')
          grep -Fq 'response.status===201' <<< "${app}"
          grep -Fq 'trackLeadSaved' <<< "${app}"
          echo 'PASS: measurement ID, consent gate, and D1-confirmed generate_lead code deployed.'
