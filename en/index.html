<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/?lang=en">
  <link rel="canonical" href="https://legacywaterusa.com/">
  <title>Legacy Water USA</title>
</head>
<body>
  <p><a id="continue" href="/?lang=en">Continue to Legacy Water USA</a></p>
  <script>
    const destination = new URL("/", location.origin);
    destination.search = location.search;
    destination.searchParams.set("lang", "en");
    document.getElementById("continue").href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
